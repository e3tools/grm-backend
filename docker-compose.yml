# docker-compose.yml
version: '3.8'

services:
  web:
    build: .
    command: python src/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - couchdb
      - redis

  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=grm_database_name
      - POSTGRES_USER=grm_db_user
      - POSTGRES_PASSWORD=Your_Postgres_Pwd

  couchdb:
    image: couchdb:3.1.1
    volumes:
      - couchdb_data:/opt/couchdb/data
    ports:
      - "5984:5984"
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password

  redis:
    image: redis:6

  celery:
    build: .
    command: celery -A grm worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - web
      - redis

volumes:
  postgres_data:
  couchdb_data: