# docker-compose.prod.yml
version: '3.8'

services:
  web:
    build: .
    command: gunicorn --chdir src --bind 0.0.0.0:8000 grm.wsgi:application
    volumes:
      - static_volume:/app/src/dashboard/static
    expose:
      - 8000
    env_file:
      - .env.prod
    depends_on:
      - db
      - couchdb
      - redis

  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env.prod.db

  couchdb:
    image: couchdb:3.1.1
    volumes:
      - couchdb_data:/opt/couchdb/data
    expose:
      - 5984
    env_file:
      - .env.prod.couchdb

  redis:
    image: redis:6

  celery:
    build: .
    command: celery -A grm worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env.prod
    depends_on:
      - web
      - redis

  nginx:
    build: ./nginx
    volumes:
      - static_volume:/app/src/dashboard/static
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  postgres_data:
  couchdb_data:
  static_volume: