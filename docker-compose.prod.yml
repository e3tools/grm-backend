version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: ${DOCKER_REGISTRY}/grm-web:${IMAGE_TAG}
    command: gunicorn grm.wsgi:application --bind 0.0.0.0:8000 --workers 4
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - ./src/grm/.env
    depends_on:
      - grm_db
      - couchdb
    networks:
      - grm_network
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    networks:
      - grm_network

  grm_db:
    image: postgres:13
    env_file:
      - ./src/grm/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    networks:
      - grm_network
    deploy:
      placement:
        constraints: [ node.role == manager ]

  couchdb:
    build:
      context: .
      dockerfile: Dockerfile.couchdb
      args:
        COUCHDB_USER: ${COUCHDB_USERNAME}
        COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
        COUCHDB_PORT: ${COUCHDB_PORT}
    image: ${DOCKER_REGISTRY}/grm-couchdb:${IMAGE_TAG}
    env_file:
      - ./src/grm/.env
    volumes:
      - couchdb_data:/opt/couchdb/data
    networks:
      - grm_network
    deploy:
      placement:
        constraints: [ node.role == manager ]

  celery:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: ${DOCKER_REGISTRY}/grm-web:${IMAGE_TAG}
    command: celery -A grm worker --loglevel=info
    env_file:
      - ./src/grm/.env
    depends_on:
      - web
      - grm_db
      - rabbitmq
    networks:
      - grm_network
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  rabbitmq:
    image: rabbitmq:3-management
    networks:
      - grm_network
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    deploy:
      placement:
        constraints: [ node.role == manager ]

volumes:
  postgres_data:
  couchdb_data:
  static_volume:
  media_volume:


networks:
  grm_network:
    driver: overlay
