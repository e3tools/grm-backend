{% load bootstrap4 i18n %}

<form id="form" enctype="multipart/form-data" class="d-flex flex-column h-100">
	{% csrf_token %}
	<div class="card-body flex-grow-1">
		<div class="overlay-wrapper">
			{% bootstrap_form form %}
			<div class="overlay submit-spin d-none">
				<i class="fas fa-2x fa-sync-alt fa-spin"></i>
			</div>
		</div>
	</div>
	<div class="card-footer mb-2 mt-auto">
		<button type="submit" class="btn btn-primary btn-sm rounded-xl float-right">
			{% if step == total_steps %}
				{% translate "Save" %}
			{% else %}
				{% translate "Next" %}
			{% endif %}
		</button>
		{% if step != 1 %}
			<button id="previous_step" data-step="{{ step }}" 
					class="btn btn-secondary btn-sm rounded-xl float-right mr-4 disabled-on-submit">
				<i class="fa fa-chevron-left mr-2"></i>
				{% translate "Previous" %}
			</button>
		{% endif %}
	</div>
</form>
