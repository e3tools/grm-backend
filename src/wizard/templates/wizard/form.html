{% load bootstrap4 i18n %}

<div class="card-header">
	<h3 class="card-title">
		{{ card_title }}
	</h3>
</div>
<form id="form" enctype="multipart/form-data" class="d-flex flex-column h-100">
	{% csrf_token %}
	<div class="card-body flex-grow-1">
		<div class="overlay-wrapper">
			{% bootstrap_form form %}
			<div class="overlay submit-spin d-none">
				<i class="fas fa-2x fa-sync-alt fa-spin"></i>
			</div>
		</div>
	</div>
	<div class="card-footer">
		{% if step != 1 %}
			<button id="previous_step" data-step="{{ step }}"
					class="btn btn-secondary disabled-on-submit">
				<i class="fa fa-chevron-left mr-2"></i>
				{% translate "Previous" %}
			</button>
		{% endif %}
		<button type="submit" class="btn btn-primary float-right">
			{% translate "Next" %}
		</button>
	</div>
</form>
