{% load bootstrap4 static i18n %}
<script src="{% static 'js/disableOnSubmit.js' %}"></script>

<form id="form" enctype="multipart/form-data">
	{% csrf_token %}
	<div class="card-body">
		<div class="overlay-wrapper">
			{% bootstrap_form form %}
			<div class="overlay submit-spin d-none">
				<i class="fas fa-2x fa-sync-alt fa-spin"></i>
			</div>
		</div>
	</div>
	<div class="card-footer mb-2">
		<button type="submit" class="btn btn-primary btn-sm rounded-xl float-right">
			{% if step == total_steps %}
				{% translate "SAVE" %}
			{% else %}
				{% translate "SAVE & NEXT" %}
			{% endif %}
		</button>
		{% if step != 1 %}
			<button id="back" data-step="{{ step }}" class="btn btn-secondary btn-sm rounded-xl float-right mr-4 
			disabled-on-submit">
				<i class="fa fa-chevron-left mr-2"></i>
				{% translate "BACK" %}
			</button>
		{% endif %}
	</div>
</form>
