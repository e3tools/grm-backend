{% load bootstrap4 i18n %}
<div class="card-body">
	<div class="form-group">
		<label>
			Administrative Levels
		</label>
		<div class="row">
			<div class="col-10">
				<input type="text" name="administrative_level1" class="form-control"
					   placeholder="Enter name of the administrative level" value="National">
			</div>
			<div class="col-2">
				<a class="btn pull-right delete-administrative-level">
					<i class="fas fa-times-circle"></i>
				</a>
			</div>
		</div>
		<div class="row mt-3">
			<div class="col-10">
				<input type="text" name="administrative_level1" class="form-control"
					   placeholder="Enter name of the administrative level" value="Provincial">
			</div>
			<div class="col-2">
				<a class="btn pull-right delete-administrative-level">
					<i class="fas fa-times-circle"></i>
				</a>
			</div>
		</div>
		<button class="btn btn-link-primary fs12 pl-0">+ Add Level</button>
	</div>
</div>
<div class="card-footer mb-2">
	<button type="submit" class="btn btn-primary btn-sm rounded-xl float-right">
		{% if step == total_steps %}
			{% translate "SAVE" %}
		{% else %}
			{% translate "SAVE & NEXT" %}
		{% endif %}
	</button>
	{% if step != 1 %}
		<button id="back" data-step="{{ step }}" class="btn btn-secondary btn-sm rounded-xl float-right mr-4 
			disabled-on-submit">
			<i class="fa fa-chevron-left mr-2"></i>
			{% translate "BACK" %}
		</button>
	{% endif %}
</div>
