{% extends 'authentication/base.html' %}{% load bootstrap4 i18n %}
{% block content %}
	<div class="card">
		<div class="card-header border-0">
			<div class="card-title">
				<div class="pt-1 fs20 lh25 text-primary text-bold-family">
					{{ title }}
				</div>
			</div>
		</div>
		<div class="card-body">
			<form method="post">
				{% csrf_token %}
				{% bootstrap_form form %}
				<div class="row">
					<div class="col-12">
						<button type="submit" class="btn btn-primary btn-block">
							{% translate "Send reset link" %}
						</button>
					</div>
				</div>
			</form>
		</div>
	</div>

{% endblock content %}
