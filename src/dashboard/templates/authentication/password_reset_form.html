{% extends 'authentication/base.html' %}{% load bootstrap4 i18n %}
{% block content %}
	<div class="card">
		<div class="card-header">
			<h3 class="card-title">
				{{ title }}
			</h3>
		</div>
		<div class="card-body">
			<form method="post">
				{% csrf_token %}
				{% bootstrap_form form %}
				<div class="row">
					<div class="col-md-12">
						<button type="submit" class="btn btn-primary btn-block">
							{% translate "Send reset link" %}
						</button>
					</div>
				</div>
			</form>
		</div>
	</div>

{% endblock content %}
