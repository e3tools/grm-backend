{% load i18n %}

<div id="toast-container" class="toast-center">
	<div id="toast-template" class="toast fade hide" role="alert" aria-live="assertive" aria-atomic="true"
		 data-delay="4000">
		<div class="toast-header">
			<strong class="mr-auto">{{ toast_title }}</strong>
            <button type="button" class="ml-2 mb-1 close" data-dismiss="toast" aria-label="{% trans "Close" %}">
                <span aria-hidden="true">&times;</span>
            </button>
		</div>
		<div class="toast-body">
			{{ toast_message }}
		</div>
	</div>
</div>
