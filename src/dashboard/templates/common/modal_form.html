{% load bootstrap4 static i18n %}
<script src="{% static 'js/disableOnSubmit.js' %}"></script>

<div class="modal-dialog">
	<div class="modal-content">
		<div class="modal-header">
			<div class="modal-title-wrapper">
				<h4 class="modal-title">{{ title }}</h4>
				{% if subtitle %}
					<small class="subtitle">{{ subtitle }}</small>
				{% endif %}
			</div>
			<button type="button" class="close" data-dismiss="modal" aria-label="Close">
				<span aria-hidden="true">×</span>
			</button>
		</div>
		<form id="{{ id_form }}" enctype="multipart/form-data">
			{% csrf_token %}
			<div class="modal-body">
				<div class="overlay-wrapper">
					{% if picture %}
						<div class="text-center">
							<img id="modal_form_picture" src="{{ picture }}" class="{{ picture_class }}">
						</div>
					{% endif %}
					{% bootstrap_form form %}
					<div class="overlay submit-spin d-none">
						<i class="fas fa-2x fa-sync-alt fa-spin"></i>
					</div>
				</div>
			</div>
			<div class="modal-footer justify-content-between">
				<button type="button" class="btn btn-default" data-dismiss="modal">
					{% translate 'Close' %}
				</button>
				<button type="submit" class="btn btn-primary">
					{{ submit_button }}
				</button>
			</div>
		</form>
	</div>
</div>
